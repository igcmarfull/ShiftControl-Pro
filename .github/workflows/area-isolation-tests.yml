name: Area isolation tests
on:
  push:
    branches: [feature/areas-estacion-tienda]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run area tests
        run: node --test tests/area-snapshot-preflight.test.cjs tests/area-rls-policy.test.cjs
