<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Inventarios ShiftControl Pro</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Maqueta del módulo Inventarios. Usa la barra lateral actual de ShiftControl con un único ítem nuevo
   y, dentro del área principal, pestañas propias. Colores y tipografía son los de la app (Inter, azul/verde/ámbar/rojo). */
:root{
  --bg:#0a0d12;--panel:#10151c;--panel2:#151b24;--panel3:#1b2230;--line:#273140;--text:#f6f8fb;--muted:#98a2b3;
  --blue:#4f8cff;--green:#2ac977;--yellow:#f4bd50;--red:#ff6565;--orange:#ff9f43;--purple:#9b6cff;--cyan:#37d5c5;
  --btn-bg:#f6f8fb;--btn-fg:#0b0e13;--shadow:0 18px 60px rgba(0,0,0,.35);
  --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3f6fb;--panel:#ffffff;--panel2:#f6f8fc;--panel3:#edf2f8;--line:#d8e0ea;--text:#142033;--muted:#667085;
  --blue:#2563d9;--green:#12935a;--yellow:#9a6a00;--red:#d13d3d;--orange:#c26a12;--purple:#6d44d6;--cyan:#0f8f84;
  --btn-bg:#142033;--btn-fg:#ffffff;--shadow:0 18px 60px rgba(20,32,51,.16);color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f6fb;--panel:#ffffff;--panel2:#f6f8fc;--panel3:#edf2f8;--line:#d8e0ea;--text:#142033;--muted:#667085;
  --blue:#2563d9;--green:#12935a;--yellow:#9a6a00;--red:#d13d3d;--orange:#c26a12;--purple:#6d44d6;--cyan:#0f8f84;
  --btn-bg:#142033;--btn-fg:#ffffff;--shadow:0 18px 60px rgba(20,32,51,.16);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:16px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:6px;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 4px 18px}
.mark{width:40px;height:40px;border-radius:12px;background:#fff;color:#0b0e13;display:grid;place-items:center;font-weight:800;border:1px solid var(--line)}
.brand b{display:block;font-size:16px}.brand span{font-size:11px;color:var(--muted)}
.grp{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--muted);font-size:13px;border:0;background:none;text-align:left;width:100%}
.nav i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6}
.nav.on{background:var(--panel3);color:var(--text);font-weight:600}.nav.on i{background:var(--cyan);opacity:1}
.nav em{margin-left:auto;font-style:normal;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--cyan);color:#06201d}

.main{min-width:0;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
.pv{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between;padding:10px 14px;border:1px dashed var(--line);border-radius:12px;background:var(--panel);margin-bottom:18px;font-size:12px;color:var(--muted)}
.pv strong{color:var(--yellow);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:11px}
.seg{display:inline-flex;background:var(--panel3);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:8px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:0 0 0 1px var(--line)}

h1{font-size:26px;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);margin:4px 0 0}
.head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:7px;align-items:center}
.tabs button.on{color:var(--text);border-color:var(--text);font-weight:600}
.badge{font-size:11px;font-weight:700;min-width:20px;text-align:center;padding:1px 6px;border-radius:99px;background:var(--red);color:#fff}

.btn{border:1px solid var(--line);background:var(--panel2);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;min-height:38px}
.btn:hover{background:var(--panel3)}
.btn.pri{background:var(--btn-bg);color:var(--btn-fg);border-color:transparent}
.btn.bad{color:var(--red)}.btn.ok{color:var(--green)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;min-height:30px;font-size:12px}
.acts{display:flex;flex-wrap:wrap;gap:8px}

.pill{--c:var(--muted);display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.pill.ok{--c:var(--green)}.pill.warn{--c:var(--yellow)}.pill.bad{--c:var(--red)}.pill.or{--c:var(--orange)}.pill.info{--c:var(--blue)}.pill.pu{--c:var(--purple)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin-bottom:22px}
.inv{--ac:var(--cyan);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.inv.cig{--ac:var(--purple)}.inv.lub{--ac:var(--blue)}
.inv.lock{opacity:.55}
.ih{display:flex;gap:12px;align-items:center}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,transparent)}
.ico svg{width:22px;height:22px}
.ih b{font-size:16px;display:block}.ih span{font-size:12px;color:var(--muted)}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0}
.kp div{min-width:0}.kp dt{font-size:11px;color:var(--muted)}.kp dd{margin:2px 0 0;font-size:20px;font-weight:700}
.kp dd.w{color:var(--yellow)}.kp dd.b{color:var(--red)}

.two{align-items:start;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.box h2{font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.box h2 small{font-weight:400;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{font-size:12px;color:var(--muted)}
.bars{display:grid;gap:9px}.bar{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;font-size:12px}
.bar i{display:block;height:8px;border-radius:9px;background:var(--panel3);overflow:hidden}.bar i b{display:block;height:100%;background:var(--orange);border-radius:9px}

.bar-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{flex:1 1 160px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:40px}
.search input{flex:1;border:0;background:none;outline:0;min-width:0;padding:8px 0}
select.sel,.fld input,.fld select,.fld textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:40px;width:100%}
select.sel{width:auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-size:12px;white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--btn-bg);color:var(--btn-fg);border-color:transparent;font-weight:600}
.chip b{font-weight:600;margin-left:4px;opacity:.7}

.tw{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:0}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.go{cursor:pointer}tbody tr.go:hover{background:var(--panel2)}
td:first-child{white-space:nowrap}td .nm{font-weight:600}td .mt{font-size:12px;color:var(--muted)}
.r{text-align:right}.stk{font-weight:700;font-size:15px}
.neg{color:var(--red)}.pos{color:var(--green)}.dim{color:var(--muted)}
.void{text-decoration:line-through;opacity:.55}

.ov{position:fixed;inset:0;background:rgba(5,8,12,.6);z-index:20;display:none}.ov.show{display:block}
.drw{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:21;overflow:auto;transform:translateX(105%);transition:transform .2s;padding:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
.drw.show{transform:none}
.mdl{position:fixed;z-index:22;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:none}
.mdl.show{display:block}
.xh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:14px}
.xh h3{margin:0;font-size:18px}.x{border:0;background:var(--panel3);width:34px;height:34px;border-radius:10px;font-size:18px;line-height:1}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:14px 0}
.dl dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.dl dd{margin:2px 0 0;font-weight:500}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.fld{display:grid;gap:5px;margin-bottom:12px}.fld>label{font-size:12px;color:var(--muted);font-weight:600}
.fld .hint{font-size:12px;color:var(--muted)}.fld .err{font-size:12px;color:var(--red)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.conv{padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--purple) 14%,transparent);border:1px solid color-mix(in srgb,var(--purple) 30%,transparent);font-weight:600;color:var(--text)}
.note{padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:12.5px}
.line{display:grid;grid-template-columns:1fr 92px 110px;gap:8px;margin-bottom:8px}

.cnt{display:flex;align-items:center;gap:6px}
.cnt button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:20px;font-weight:600}
.cnt input{width:64px;text-align:center;font-size:18px;font-weight:700;border:1px solid var(--line);background:var(--panel2);border-radius:10px;height:40px}
.prog{height:8px;border-radius:9px;background:var(--panel3);overflow:hidden}.prog b{display:block;height:100%;background:var(--green)}
.sticky{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;transition:.2s;background:var(--btn-bg);color:var(--btn-fg);padding:11px 16px;border-radius:12px;font-weight:600;z-index:30;max-width:calc(100% - 32px);pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
.empty{padding:28px;text-align:center;color:var(--muted)}

@media (max-width:1000px){.app{grid-template-columns:1fr}.side{display:none}.two{grid-template-columns:1fr}}
@media (max-width:760px){
  h1{font-size:22px}
  .kp dd{font-size:18px}
  .tw{background:none;border:0;overflow:visible}
  table,tbody{display:block}thead{display:none}
  tbody tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  td{border:0;padding:0;display:block}
  td.ttl{grid-column:1/-1}
  td[data-l]::before{content:attr(data-l);display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  td.hid{display:none}
  td.ttl::before{display:none}
  .r{text-align:left}
  .line{grid-template-columns:1fr 1fr}.line select:first-child{grid-column:1/-1}
  .dl,.g2{grid-template-columns:1fr 1fr}
  .mdl{top:auto;bottom:0;left:0;transform:none;width:100%;max-height:92%;border-radius:18px 18px 0 0}
  .drw{width:100%}
  .bar{grid-template-columns:90px 1fr 30px}
  .pv{padding:8px 12px;font-size:11px;margin-bottom:12px}
  .head{margin-bottom:10px}.sub{font-size:13px}
  .cnt button{width:38px}.cnt{gap:5px}
  .row-c{flex-wrap:nowrap!important}.row-c .nmc{flex:1 1 0!important;min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    return head('Revisar conteo · '+INV[inv].name,`${rows.length} productos contados. Revisa las diferencias antes de enviar.`)
     +rows.map(p=>{const s=stock(p.code),d=Number(c[p.code])-s;return `<div class="box" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b>${esc(p.name)}</b><div class="sub">Sistema ${s} · Contado ${c[p.code]}</div></div><span class="pill ${d===0?'ok':'warn'}">${d===0?'Exacto':(d>0?'+':'')+d}</span></div>${d!==0?`<div class="fld" style="margin:10px 0 0"><label for="n-${p.code}">Observación (obligatoria)</label><input id="n-${p.code}" data-note="${p.code}" placeholder="Qué pasó con esta diferencia"></div>`:''}</div>`}).join('')
     +`<div class="sticky"><button class="btn" data-back="1">Volver al conteo</button><button class="btn pri" data-send="${inv}">Enviar conteo</button></div>`;
  }
  const rows=l.filter(p=>!q||[p.code,p.name,p.bar].join(' ').toLowerCase().includes(q));
  return head('Toma de inventario · '+INV[inv].name,'Cuenta lo que ves en el estante. El stock del sistema se muestra solo al revisar.',`<button class="btn" data-go="${inv}">Salir del conteo</button>`)
   +`<div class="bar-tools" style="flex-wrap:nowrap"><label class="search" style="min-width:0"><span class="dim">⌕</span><input id="q" type="search" placeholder="Buscar producto o código" value="${esc(S.q)}" autocomplete="off"></label><button class="btn" disabled title="Etapa 3: lectura con la cámara. El módulo funciona sin ella." style="flex:0 0 auto">Escanear</button></div>
   <div style="margin:4px 0 14px"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px"><span>${done} de ${l.length} contados</span><span>${Math.round(done/l.length*100)}%</span></div><div class="prog"><b style="width:${done/l.length*100}%"></b></div></div>`
   +rows.map(p=>`<div class="box row-c" style="margin-bottom:8px;padding:12px 14px;display:flex;gap:10px;justify-content:space-between;align-items:center"><div class="nmc" style="min-width:0;flex:1 1 150px"><b>${esc(p.name)}</b><div class="sub" style="font-size:12px">${p.code} · ${esc(p.loc)}${inv==='cig'?' · en cajetillas':''}</div></div><div class="cnt"><button data-step="${p.code}:-1" aria-label="Restar">−</button><input inputmode="numeric" pattern="[0-9]*" data-cnt="${p.code}" value="${c[p.code]??''}" placeholder="—" aria-label="Contado ${esc(p.name)}"><button data-step="${p.code}:1" aria-label="Sumar">+</button></div></div>`).join('')
   +`<div class="sticky"><button class="btn" data-save="${inv}">Guardar parcial</button><button class="btn pri" data-review="${inv}" ${done?'':'disabled'}>Revisar diferencias</button></div>`;
}
function render(){
  const v=S.view;let html;
  if(v==='home')html=home();else if(INV[v])html=inventory(v);else if(v==='mov')html=movements();else if(v==='apr')html=approvals();else if(v.startsWith('count:'))html=counting(v.split(':')[1]);
  $('view').innerHTML=html;
  const q=$('q');if(q&&document.activeElement===document.body&&S._focusQ){q.focus();try{q.setSelectionRange(q.value.length,q.value.length)}catch(_e){}}S._focusQ=false;
}

/* ---------- Ficha, formularios ---------- */
function openDrawer(code){
  const p=byId(code),s=stock(code),a=alerts(p),gm=S.role==='gerente',ml=M.filter(m=>m.sku===code&&m.type!=='Saldo inicial').slice(-5).reverse(),lt=lots(code);
  const extra={tienda:`<div><dt>Marca</dt><dd>${esc(p.brand)}</dd></div><div><dt>Categoría</dt><dd>${esc(p.cat)}</dd></div>`,cig:`<div><dt>Marca</dt><dd>${esc(p.brand)}</dd></div><div><dt>Variedad</dt><dd>${esc(p.variety)}</dd></div>`,lub:`<div><dt>Marca</dt><dd>${esc(p.brand)}</dd></div><div><dt>Viscosidad</dt><dd>${esc(p.visc)}</dd></div><div><dt>Especificación</dt><dd>${esc(p.spec)}</dd></div>`}[p.inv];
  $('drw').innerHTML=`<div class="xh"><div><span class="pill ${p.inv==='cig'?'pu':p.inv==='lub'?'info':'ok'}">${INV[p.inv].name}</span><h3 style="margin-top:8px">${esc(p.name)}</h3></div><button class="x" data-close="1" aria-label="Cerrar">×</button></div>
   <div style="display:flex;gap:10px;align-items:baseline"><span class="big num">${s}</span><span class="sub">${p.unitc}s · stock calculado de los movimientos</span></div><div style="margin:6px 0">${pill(a)}</div>
   <dl class="dl"><div><dt>Código interno</dt><dd>${p.code}</dd></div><div><dt>Código de barras</dt><dd class="num">${p.bar}</dd></div>${extra}<div><dt>Presentación</dt><dd>${esc(p.pres)}</dd></div><div><dt>Unidad de control</dt><dd>${p.unitc}</dd></div><div><dt>Ubicación</dt><dd>${esc(p.loc)}</dd></div><div><dt>Stock mínimo</dt><dd class="num">${p.min}</dd></div><div><dt>Estado</dt><dd>${p.active?'Activo':'Inactivo'}</dd></div><div><dt>Creado</dt><dd>${new Date(p.created).toLocaleDateString('es-CL')}</dd></div>${p.inv==='cig'?`<div><dt>Cajetillas por cartón</dt><dd><input type="number" min="1" value="${p.factor}" data-factor="${p.code}" style="width:72px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 8px" ${gm?'':'disabled'}></dd></div>`:''}</dl>
   <div class="acts" style="margin-bottom:16px">${p.inv==='tienda'?`<button class="btn" data-act="merma:${code}">Registrar merma</button>`:''}<button class="btn" data-act="salida:${code}">Salida justificada</button>${p.inv==='tienda'?`<button class="btn" data-act="traslado:${code}">Trasladar</button>`:''}<button class="btn" ${gm?'':'disabled title="Solo el gerente administra el catálogo"'} data-toggle="${code}">${p.active?'Desactivar':'Activar'}</button></div>
   ${lt.length?`<h4 style="margin:0 0 6px">Lotes · FEFO, vence primero lo primero</h4>${lt.map((l,i)=>`<div class="row"><div class="t"><b>${l.lote}</b><span>Vence ${new Date(l.venc).toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'numeric'})}</span></div>${i===0?'<span class="pill info">Salir primero</span>':''}${days(l.venc)<0?'<span class="pill bad">Vencido</span>':days(l.venc)<=7?`<span class="pill or">${days(l.venc)} d</span>`:''}<b class="num">${l.qty}</b></div>`).join('')}`:''}
   <h4 style="margin:16px 0 6px">Últimos movimientos</h4>${ml.map(movRow).join('')||'<div class="sub">Sin movimientos.</div>'}`;
  show('drw');
}
function show(id){$('ov').classList.add('show');$(id).classList.add('show')}
function closeAll(){['ov','drw','mdl'].forEach(i=>$(i).classList.remove('show'))}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
function modal(title,body,foot){$('mdl').innerHTML=`<div class="xh"><h3>${title}</h3><button class="x" data-close="1" aria-label="Cerrar">×</button></div>${body}<div class="acts" style="justify-content:flex-end;margin-top:6px">${foot}</div>`;show('mdl')}
function recForm(inv){
  S.recInv=inv;const opts=prods(inv).filter(p=>p.active).map(p=>`<option value="${p.code}">${esc(p.name)}</option>`).join('');
  const lines=S.recLines.map((l,i)=>{const p=l.sku?byId(l.sku):null,cart=p&&p.inv==='cig';
    return `<div class="line"><select data-rl="${i}:sku" aria-label="Producto"><option value="">Producto…</option>${prods(inv).filter(x=>x.active).map(x=>`<option value="${x.code}" ${l.sku===x.code?'selected':''}>${esc(x.name)}</option>`).join('')}</select><input type="number" min="1" inputmode="numeric" placeholder="Cant." data-rl="${i}:qty" value="${l.qty}" aria-label="Cantidad"><select data-rl="${i}:unit" aria-label="Unidad" ${cart?'':'disabled'}><option value="base" ${l.unit==='base'?'selected':''}>${cart?'Cajetillas':(p?({unidad:'Unidades',envase:'Envases',cajetilla:'Cajetillas'}[p.unitc]):'Unidades')}</option>${cart?`<option value="box" ${l.unit==='box'?'selected':''}>Cartones</option>`:''}</select></div>${cart&&l.qty&&l.unit==='box'?`<div class="conv" style="margin:-2px 0 10px">${l.qty} cartones × ${p.factor} = ${l.qty*p.factor} cajetillas</div>`:''}`}).join('');
  modal('Recepción de mercadería · '+INV[inv].name,`<div class="g2"><div class="fld"><label for="r-sup">Proveedor</label><select id="r-sup">${SUPPLIERS.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="fld"><label for="r-date">Fecha de recepción</label><input id="r-date" type="date" value="2026-10-14"></div></div>
   <div class="g2"><div class="fld"><label for="r-doc">N.º de factura o documento</label><input id="r-doc" placeholder="Ej.: F-1190" value="${esc(S.recDoc||'')}"><span class="err" id="r-err"></span></div><div class="fld"><label for="r-who">Responsable</label><input id="r-who" value="${ROLES[S.role].label}" readonly></div></div>
   <div class="fld"><label for="r-fac">Factura vinculada (opcional)</label><select id="r-fac"><option>Sin factura vinculada</option><option>F-1182 · Distribuidora Norte · pendiente de aprobación</option><option>F-1190 · Comercial Sur · aprobada</option></select><span class="hint">La factura se aprueba y se paga en «Facturas y compras». Recibir mercadería no la aprueba, y una factura ingresada no significa que todo llegó.</span></div>
   <div class="fld"><label>Productos recibidos</label>${lines}<button class="btn sm" data-addline="1" style="justify-self:start">+ Agregar producto</button></div>
   <div class="fld"><label for="r-ph">Evidencia fotográfica (opcional)</label><input id="r-ph" type="file" accept="image/*"></div>
   <div class="fld"><label for="r-obs">Observaciones</label><textarea id="r-obs" rows="2"></textarea></div>`,
   `<button class="btn" data-close="1">Cancelar</button><button class="btn pri" data-recok="${inv}">Confirmar recepción</button>`);
}
function actForm(kind,code){
  const p=byId(code);
  const reasons=kind==='merma'?['Vencimiento','Daño','Manipulación','Otra causa justificada']:['Degustación autorizada','Uso interno','Consumo de la estación','Otra causa justificada'];
  modal({merma:'Registrar merma',salida:'Salida justificada',traslado:'Trasladar'}[kind]+' · '+esc(p.name),
   kind==='traslado'?`<div class="fld"><label>Desde</label><input value="${esc(p.loc)}" readonly></div><div class="fld"><label for="a-dest">A</label><select id="a-dest"><option>Bodega</option><option>Sala de ventas</option><option>Refrigerador 1</option><option>Refrigerador 2</option><option>Congelador 1</option></select></div>`
   :`<div class="g2"><div class="fld"><label for="a-qty">Cantidad</label><input id="a-qty" type="number" min="1" inputmode="numeric" placeholder="0"><span class="err" id="a-err"></span></div><div class="fld"><label for="a-why">Motivo</label><select id="a-why">${reasons.map(r=>`<option>${r}</option>`).join('')}</select></div></div>${kind==='merma'?`<div class="fld"><label for="a-ph">Evidencia fotográfica (opcional)</label><input id="a-ph" type="file" accept="image/*"></div>`:''}`
   +`<div class="fld"><label for="a-note">Observación</label><textarea id="a-note" rows="2" placeholder="Obligatoria"></textarea></div>`,
   `<button class="btn" data-close="1">Cancelar</button><button class="btn pri" data-actok="${kind}:${code}">Confirmar</button>`);
}
function newForm(inv){
  const cig=inv==='cig',lub=inv==='lub';
  modal('Nuevo producto · '+INV[inv].name,`<div class="g2"><div class="fld"><label for="n-code">${lub?'SKU':'Código interno'}</label><input id="n-code" placeholder="${inv==='tienda'?'T-0801':cig?'C-011':'L-011'}"><span class="err" id="n-err"></span></div><div class="fld"><label for="n-bar">Código de barras</label><input id="n-bar" inputmode="numeric" placeholder="Opcional"></div></div>
   <div class="fld"><label for="n-name">Descripción</label><input id="n-name"></div>
   <div class="g2"><div class="fld"><label for="n-brand">Marca</label><input id="n-brand"></div><div class="fld"><label for="n-pres">Presentación</label><input id="n-pres" placeholder="${lub?'1 L, 4 L, 5 L':cig?'Cajetilla 20':'Botella 500 ml'}"></div></div>
   ${lub?`<div class="g2"><div class="fld"><label for="n-visc">Viscosidad</label><input id="n-visc" placeholder="5W-30"></div><div class="fld"><label for="n-spec">Especificación</label><input id="n-spec" placeholder="API SP"></div></div>`:''}
   ${cig?`<div class="fld"><label for="n-fac">Cajetillas por cartón</label><input id="n-fac" type="number" value="10" min="1"></div>`:''}
   <div class="g2"><div class="fld"><label for="n-loc">Ubicación</label><input id="n-loc"></div><div class="fld"><label for="n-min">Stock mínimo</label><input id="n-min" type="number" min="0" value="0"></div></div>`,
   `<button class="btn" data-close="1">Cancelar</button><button class="btn pri" data-newok="${inv}">Crear producto</button>`);
}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,tr[data-open]');if(!t)return;const d=t.dataset;
  if(d.role){S.role=d.role;document.querySelectorAll('#roleSeg button').forEach(b=>b.classList.toggle('on',b.dataset.role===S.role));S.q='';S.cat='Todas';S.st='todos';S.review=false;if(S.view!=='home'&&S.view!=='mov'&&S.view!=='apr'&&INV[S.view]&&!can(S.view))S.view='home';if(S.view.startsWith('count:'))S.view='home';closeAll();render();return}
  if(d.go){S.view=d.go;S.q='';S.cat='Todas';S.st='todos';S.review=false;if(INV[d.go])S.inv=d.go;render();window.scrollTo({top:0});return}
  if(d.open){openDrawer(d.open);return}
  if(d.close||t===$('ov')){closeAll();return}
  if(d.cat!==undefined){S.cat=d.cat;render();return}
  if(d.minv){S.minv=d.minv;render();return}
  if(d.count){S.view='count:'+d.count;S.q='';S.review=false;render();window.scrollTo({top:0});return}
  if(d.new){newForm(d.new);return}
  if(d.rec){S.recLines=[{sku:'',qty:'',unit:'base'}];S.recDoc='';recForm(d.rec);return}
  if(d.addline){S.recLines.push({sku:'',qty:'',unit:'base'});recForm(S.recInv);return}
  if(d.recok){const sup=$('r-sup').value,doc=$('r-doc').value.trim(),inv=d.recok;
    if(!doc){$('r-err').textContent='Ingresa el número de documento.';return}
    const key=inv+'|'+sup+'|'+doc.toLowerCase();if(S.recs[key]){$('r-err').textContent='Esta recepción ya fue registrada. No se duplican los movimientos.';return}
    const ls=S.recLines.filter(l=>l.sku&&Number(l.qty)>0);if(!ls.length){toast('Agrega al menos un producto con cantidad');return}
    S.recs[key]=1;ls.forEach(l=>{const p=byId(l.sku),q=Number(l.qty)*(l.unit==='box'?p.factor:1);mv({sku:l.sku,inv,type:'Recepción',qty:q,who:ROLES[S.role].label,ts:'2026-10-14T09:40',ref:doc,note:(l.unit==='box'?`${l.qty} cartones × ${p.factor} cajetillas`:sup)+($('r-obs').value?' · '+$('r-obs').value:'')});
      if(p.vence)LOTS.push({sku:l.sku,lote:'L-NEW'+(LOTS.length+1),venc:'2027-01-15',qty:q})});
    closeAll();render();toast(`Recepción registrada · ${ls.length} movimiento${ls.length>1?'s':''}`);return}
  if(d.act){const[k,c]=d.act.split(':');closeAll();actForm(k,c);return}
  if(d.actok){const[k,c]=d.actok.split(':'),p=byId(c);
    if(k==='traslado'){const dest=$('a-dest').value,from=p.loc;p.loc=dest;mv({sku:c,inv:p.inv,type:'Traslado',qty:0,who:ROLES[S.role].label,ts:'2026-10-14T09:45',note:from+' → '+dest});closeAll();render();toast('Traslado registrado');return}
    const q=Number($('a-qty').value),note=$('a-note').value.trim();
    if(!(q>0)){$('a-err').textContent='Ingresa una cantidad.';return}if(q>stock(c)){$('a-err').textContent='No puede superar el stock ('+stock(c)+').';return}if(!note){toast('La observación es obligatoria');return}
    mv({sku:c,inv:p.inv,type:k==='merma'?'Merma':'Salida justificada',qty:-q,who:ROLES[S.role].label,ts:'2026-10-14T09:45',reason:$('a-why').value,note});
    let r=q;lots(c).forEach(l=>{const u=Math.min(l.qty,r);l.qty-=u;r-=u});closeAll();render();toast('Movimiento registrado');return}
  if(d.newok){const inv=d.newok,code=$('n-code').value.trim().toUpperCase();
    if(!code){$('n-err').textContent='Ingresa el código.';return}
    const dup=P.find(p=>p.code===code);
    if(dup){$('n-err').textContent=dup.inv===inv?'Ese código ya existe en el inventario '+INV[inv].name+'.':'En esta maqueta ese código ya lo usa '+INV[dup.inv].name+'. En el sistema real cada catálogo tiene sus propios códigos.';return}
    const o={cat:inv==='tienda'?'Otros productos comerciales':INV[inv].name,brand:$('n-brand').value,pres:$('n-pres').value,loc:$('n-loc').value,min:Number($('n-min').value)||0,s0:0,unitc:{tienda:'unidad',cig:'cajetilla',lub:'envase'}[inv],created:'2026-10-14'};
    if(inv==='cig'){o.factor=Number($('n-fac').value)||10;o.variety=''}if(inv==='lub'){o.visc=$('n-visc').value;o.spec=$('n-spec').value}
    add(inv,code,$('n-name').value||'Producto nuevo',o);byId(code).bar=$('n-bar').value||'—';mv({sku:code,inv,qty:0,who:ROLES[S.role].label,ts:'2026-10-14T09:50',note:'Producto creado'});closeAll();render();toast('Producto creado con stock 0');return}
  if(d.toggle){const p=byId(d.toggle);p.active=!p.active;closeAll();render();toast(p.active?'Producto activado':'Producto desactivado. Conserva su historial.');return}
  if(d.void){const o=M.find(m=>m.id===d.void);mv({sku:o.sku,inv:o.inv,type:'Anulación',qty:-o.qty,who:'Gerente',ts:'2026-10-14T10:05',corrige:o.id,note:'Corrección autorizada de '+o.id});render();toast('Movimiento compensatorio creado. El original se conserva.');return}
  if(d.apr||d.rej){const a=ADJ.find(x=>x.id===(d.apr||d.rej));if(d.apr){a.st='aprobado';mv({sku:a.sku,inv:a.inv,type:'Ajuste aprobado',qty:a.cnt-a.sys,who:'Gerente',ts:'2026-10-14T10:10',ref:a.id,note:a.note});toast('Ajuste aprobado. El stock se actualizó con un movimiento.')}else{a.st='rechazado';toast('Ajuste rechazado. El stock no cambió.')}render();return}
  if(d.step){const[c,s]=d.step.split(':'),inv=byId(c).inv,cur=Number(S.counts[inv][c]||0);S.counts[inv][c]=Math.max(0,cur+Number(s));render();return}
  if(d.save){toast('Conteo guardado. Puedes continuarlo después.');return}
  if(d.review){S.review=true;render();window.scrollTo({top:0});return}
  if(d.back){S.review=false;render();return}
  if(d.send){const inv=d.send,c=S.counts[inv];let n=0,ex=0;
    const rows=prods(inv).filter(p=>c[p.code]!==undefined&&c[p.code]!=='');
    for(const p of rows){const diff=Number(c[p.code])-stock(p.code);if(diff!==0&&!(document.querySelector(`[data-note="${p.code}"]`)?.value.trim())){toast('Falta la observación en '+p.name);return}}
    rows.forEach(p=>{const diff=Number(c[p.code])-stock(p.code);if(diff===0){ex++;mv({sku:p.code,inv,type:'Conteo exacto',qty:0,who:ROLES[S.role].label,ts:'2026-10-14T10:00',note:'Sin diferencia'})}else{n++;ADJ.push({id:'A-'+String(10+ADJ.length).padStart(4,'0'),inv,sku:p.code,sys:stock(p.code),cnt:Number(c[p.code]),who:ROLES[S.role].label,ts:'2026-10-14T10:00',note:document.querySelector(`[data-note="${p.code}"]`).value,st:'pendiente'})}});
    S.counts[inv]={};S.review=false;S.view=inv;render();toast(`Conteo enviado: ${ex} exactos, ${n} diferencia${n===1?'':'s'} por aprobar. El stock no cambió.`);return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.q=t.value;S._focusQ=true;render();t.focus()}
  else if(t.dataset.cnt){const inv=byId(t.dataset.cnt).inv;S.counts[inv][t.dataset.cnt]=t.value.replace(/\D/g,'');
    const l=prods(inv).filter(p=>p.active),done=l.filter(p=>S.counts[inv][p.code]!==undefined&&S.counts[inv][p.code]!=='').length;
    document.querySelector('.prog b').style.width=done/l.length*100+'%';document.querySelector('.prog').previousElementSibling.firstElementChild.textContent=done+' de '+l.length+' contados';
    const b=document.querySelector('[data-review]');if(b)b.disabled=!done}
  else if(t.dataset.rl){const[i,k]=t.dataset.rl.split(':');S.recLines[i][k]=t.value;if(k==='sku'){S.recLines[i].unit='base'}S.recDoc=$('r-doc').value;const keep=['r-sup','r-date'].map(x=>$(x).value);recForm(S.recInv);$('r-sup').value=keep[0];$('r-date').value=keep[1];const f=document.querySelector(`[data-rl="${i}:${k}"]`);if(f&&k==='qty')f.focus()}
  else if(t.dataset.factor){const p=byId(t.dataset.factor);p.factor=Math.max(1,Number(t.value)||1)}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='st'){S.st=t.value;render()}
  else if(t.dataset.acc){S.access[t.dataset.acc]=t.value;toast('Acceso actualizado: '+INV[t.dataset.acc].name+' → '+t.value);render()}
  else if(t.dataset.rl&&t.tagName==='SELECT'){}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
$('ov').addEventListener('click',closeAll);
render();
})();
</script>
